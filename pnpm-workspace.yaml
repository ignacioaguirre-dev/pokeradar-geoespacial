allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  # mapshaper extras we do not use (GeoPackage, msgpack acceleration); esbuild ships its binary as an optional package
  better-sqlite3: false
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false
auditConfig:
  ignoreGhsas:
    # minimatch <11.0.1 (moderate ReDoS) only reaches the lint toolchain via
    # typescript-eslint, which still requires minimatch ^10. Globs come from our
    # own config. Drop this once typescript-eslint moves to minimatch 11.
    - GHSA-g3hv-75wg-m249
