name: capturas

on:
  workflow_dispatch:
    inputs:
      rama:
        description: Rama sobre la que regenerar las capturas de base
        required: true

permissions:
  contents: read

jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      - run: pnpm exec playwright test --project=chromium --grep @visual --update-snapshots

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: capturas
          path: e2e/__capturas__
