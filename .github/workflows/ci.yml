name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch flow and PR title
        # Untrusted PR data goes through env, never interpolated into the script
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          fail=0

          case "$BASE" in
            main)    allowed='^(release|hotfix)/' ;;
            develop) allowed='^(feat|fix|chore|release|hotfix)/' ;;
          esac
          if ! [[ "$HEAD" =~ $allowed ]]; then
            echo "::error::La rama '$HEAD' no puede integrarse en '$BASE' (permitido: $allowed)"
            fail=1
          fi
          if ! [[ "$HEAD" =~ ^[a-z]+/[a-z0-9.][a-z0-9.-]*$ ]]; then
            echo "::error::'$HEAD' no sigue <tipo>/<descripcion-en-kebab-case>"
            fail=1
          fi

          title_re='^(feat|fix|chore|docs|refactor|test|ci|perf|build|style|revert)(\([a-z0-9-]+\))?!?: [a-z0-9].*$'
          if ! [[ "$TITLE" =~ $title_re ]]; then
            echo "::error::El título '$TITLE' no sigue 'tipo(alcance): asunto' con asunto en minúscula"
            fail=1
          fi

          # Release and hotfix titles may use another type (e.g. chore(release), fix)
          prefix="${HEAD%%/*}"
          type="${TITLE%%[(:!]*}"
          if [[ "$prefix" =~ ^(feat|fix|chore)$ && "$type" != "$prefix" ]]; then
            echo "::error::El tipo del título ('$type') no coincide con el prefijo de la rama ('$prefix')"
            fail=1
          fi

          exit $fail

  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
